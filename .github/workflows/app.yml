name: desktop app

# Cockpit (sw/gui) UI suite + the shared Rust crate suites, on the app's two
# supported platforms. Linux is deliberately absent: the project targets
# Windows and macOS only (docs/setup.md), so there is no Linux cell to keep
# green. Path-filtered so firmware-only pushes don't burn macOS minutes.
on:
  push:
    # usb_serial_protocol is listed so the matrix proves itself pre-PR;
    # workflow_dispatch can't target a branch until the file reaches main.
    branches: [main, usb_serial_protocol]
    paths:
      - "sw/gui/**"
      - "sw/lib/rust/**"
      - ".github/workflows/app.yml"
  pull_request:
    paths:
      - "sw/gui/**"
      - "sw/lib/rust/**"
      - ".github/workflows/app.yml"
  # Manual runs: lets a feature branch prove the matrix (esp. the macOS
  # leg) before its PR exists.
  workflow_dispatch:

# Match ci.yml: every run step goes through bash (Git Bash on Windows).
defaults:
  run:
    shell: bash

jobs:
  app:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # --- webview UI suite (playwright over the devmock) -----------------
      # test_views.py needs only the stdlib and playwright; the repo-wide
      # requirements.txt drags scientific wheels the suite never imports,
      # so CI installs the one dependency directly.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install playwright + chromium
        run: |
          pip install playwright
          python -m playwright install chromium

      # The views_015 budget smoke inside the suite launches a HEADED
      # chromium for 12 s and asserts render capability; GitHub runners
      # rasterize with software GL, so this is the step most likely to need
      # calibration after the first real runs — deliberately not softened
      # in advance. The 60 s spec run (PCS_RENDER_BUDGET=full) stays a
      # bench-side gate, not CI.
      - name: Run the UI suite
        timeout-minutes: 20
        run: python sw/gui/tests/test_views.py 2>&1 | tee ui-suite.log

      - name: Upload UI suite log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-suite-log-${{ matrix.os }}
          path: ui-suite.log

      # --- Rust suites -----------------------------------------------------
      # Rust is preinstalled on GitHub runners (same assumption as ci.yml).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            sw/gui/src-tauri
            sw/lib/rust/dwarf_map
            sw/lib/rust/pcs_wire
            sw/lib/rust/pcs_proto
            sw/lib/rust/prng

      # pcs_proto generates its bindings via protox at build time — no
      # protoc install needed on the runner.
      - name: Test shared Rust crates
        timeout-minutes: 15
        run: |
          for crate in dwarf_map pcs_wire pcs_proto prng; do
            (cd "sw/lib/rust/$crate" && cargo test)
          done

      # firmware_backend's DLL-backed tests skip themselves (early return
      # with a message) when the natively built firmware library is absent;
      # CI doesn't build the C firmware here, so those cases self-skip and
      # the rest of the suite still runs.
      - name: Test the Tauri core
        timeout-minutes: 25
        run: cd sw/gui/src-tauri && cargo test
