// pcs_bldc board <-> host protocol schema — the single source of truth for
// every message exchanged over the framed USB CDC transport.
//
// Firmware C bindings are generated with nanopb (static allocation bounds in
// pcs_bldc.options); regenerate with tools/generate_proto.sh. The desktop app
// generates its Rust bindings with prost from this same file.

syntax = "proto3";

package pcs;

// Every frame payload is exactly one Envelope. request_id correlates a
// Response to the request that caused it; firmware-initiated stream messages
// (e.g. log) carry request_id 0.
message Envelope {
  uint32 request_id = 1;
  oneof payload {
    PingRequest     ping             = 2;
    Response        response         = 3;
    LogText         log              = 4;
    IdentityRequest identity_request = 5;
    Identity        identity         = 6;
  }
}

// Round-trip liveness probe; answered with an accepted Response.
message PingRequest {
}

// Request acknowledgement: accepted, or rejected with a cause.
message Response {
  bool   accepted = 1;
  string cause    = 2;
}

// A chunk of firmware standard-output text.
message LogText {
  string text = 1;
}

// Query the running firmware's build identity.
message IdentityRequest {
}

// The build identity: commit hash of the built source, extended with a
// hash of the uncommitted diff when the tree was dirty. Doubles as the
// firmware version string.
message Identity {
  string build_id = 1;
}
