[package]
name = "pcs_proto"
version = "0.0.0"
edition = "2021"
publish = false
description = "prost bindings for the board protocol, generated at build time from the shared/trace/board schema split. protox compiles the .proto sources, so no protoc install is needed."

[dependencies]
prost = "0.13"

[build-dependencies]
prost-build = "0.13"
protox = "0.7"

[dev-dependencies]
pcs_wire = { path = "../pcs_wire" }
